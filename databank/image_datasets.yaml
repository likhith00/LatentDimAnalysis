defaults:
  library: torchvision
  samples_to_load: 10000
  download: true

datasets:

  mnist:
    display_name: MNIST
    torchvision_class: MNIST

    input_shape: [1, 28, 28]
    size: [28, 28]
    expected_classes: 10

    split_type: train_test

    train_args:
      train: true

    test_args:
      train: false


  fmnist:
    display_name: Fashion-MNIST
    torchvision_class: FashionMNIST

    input_shape: [1, 28, 28]
    size: [28, 28]
    expected_classes: 10

    split_type: train_test

    train_args:
      train: true

    test_args:
      train: false


  cifar100:
    display_name: CIFAR-100
    torchvision_class: CIFAR100

    input_shape: [3, 32, 32]
    size: [32, 32]
    expected_classes: 100

    split_type: train_test

    train_args:
      train: true

    test_args:
      train: false


  emnist_balanced:
    display_name: EMNIST Balanced
    torchvision_class: EMNIST

    input_shape: [1, 28, 28]
    size: [28, 28]
    expected_classes: 47

    split_type: train_test

    common_args:
      split: balanced

    train_args:
      train: true

    test_args:
      train: false


  caltech101:
    display_name: Caltech-101
    torchvision_class: Caltech101

    input_shape: null
    size: [64, 64]
    expected_classes: 101

    split_type: full


  eurosat:
